name: Build and Package

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd ./frontend
          pnpm install

      - name: Build frontend
        run: |
          cd ./frontend
          pnpm build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/lib/
          retention-days: 1

  build-and-package:
    name: Build and Package
    needs: build-frontend
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/lib/

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          rustflags: ''

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Sentry CLI
        run: |
          npm install -g @sentry/cli

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Process release binary
        run: |
          sentry-cli --url ${{ secrets.SENTRY_URL }} debug-files upload --include-sources --org ${{ secrets.SENTRY_ORG }} --project ${{ secrets.SENTRY_PROJECT }} --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} target/${{ matrix.target }}/release/api

          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/api dist/${{ matrix.arch }}/api

      - name: Strip release binary
        run: |
          strip dist/${{ matrix.arch }}/api

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/api
          retention-days: 1

  create-multiarch-image:
    name: Create multi-arch Docker image
    needs: build-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: api-*
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare binaries
        run: |
          chmod +x dist/api-amd64/api
          chmod +x dist/api-arm64/api

          mkdir -p .docker/amd64 .docker/arm64
          cp dist/api-amd64/api .docker/amd64/api
          cp dist/api-arm64/api .docker/arm64/api
          cp entrypoint.sh .docker/

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mcjars/www:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
